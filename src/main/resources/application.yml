spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:

            - id: auth-service-auth
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/auth/**

            - id: auth-service-user
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/user/**

            - id: product-service-chain
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/chain/**

            - id: product-service-brand
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/brand/**

            - id: product-service-category
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/category/**

            - id: product-service-customization
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/customization/**

            - id: product-service-product
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/product/**

            - id: product-service-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/service/**

            - id: product-service-sku
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/sku/**

            - id: product-service-skutier
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/skutier/**

            - id: product-service-store
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/store/**

            - id: product-service-storeservicetype
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/storeservicetype/**

            - id: product-service-subservice
              uri: http://localhost:8082
              predicates:
                  - Path=/api/v1/subservice/**

            - id: product-service-tier
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/tier/**

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081
management:
  endpoints:
    web:
      exposure:
        include: gateway,health

logging:
  level:
    org.springframework.security: TRACE
    org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator: TRACE
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.servlet.function: TRACE
    org.springframework.web.servlet.DispatcherServlet: TRACE
    org.springframework.web: DEBUG
